name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,stylua
      - run: npm install --global tree-sitter-cli@0.27.2
      - run: just test
      - run: stylua --check lua tests scripts
